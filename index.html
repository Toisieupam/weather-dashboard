<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">☼</div>
          <div>
            <p class="eyebrow">Weather dashboard</p>
            <h1>Forecast</h1>
          </div>
        </div>

        <form class="search-bar" id="searchForm">
          <input id="cityInput" type="text" placeholder="Tìm thành phố..." aria-label="Search city" />
          <button type="submit">Tìm</button>
        </form>
      </header>

      <main class="layout">
        <section class="hero-panel" id="heroPanel">
          <div class="sky-scene" id="skyScene">
            <div class="sun"></div>
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
            <div class="rain rain-1"></div>
            <div class="rain rain-2"></div>
            <div class="rain rain-3"></div>
            <div class="mist"></div>
            <div class="mountains"></div>
          </div>

          <div class="hero-overlay">
            <div class="location-row">
              <div>
                <p class="muted" id="dateLabel">--</p>
                <h2 id="cityName">Hà Nội</h2>
              </div>
              <span class="status-pill" id="statusPill">Clear</span>
            </div>

            <div class="temp-row">
              <div class="temp-wrap">
                <span class="temp" id="currentTemp">--°</span>
                <span class="feels-like" id="feelsLike">Cảm giác như --°</span>
              </div>
              <div class="condition-wrap">
                <div class="condition-icon" id="conditionIcon">☀️</div>
                <p id="conditionText">--</p>
              </div>
            </div>

            <div class="meta-grid">
              <div class="meta-item">
                <span>Humidity</span>
                <strong id="humidity">--%</strong>
              </div>
              <div class="meta-item">
                <span>Wind</span>
                <strong id="wind">-- km/h</strong>
              </div>
              <div class="meta-item">
                <span>Pressure</span>
                <strong id="pressure">-- hPa</strong>
              </div>
              <div class="meta-item">
                <span>Visibility</span>
                <strong id="visibility">-- km</strong>
              </div>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <div class="card">
            <div class="card-header">
              <span>Sun cycle</span>
            </div>
            <div class="sun-cycle">
              <div class="sun-line">
                <span class="sun-orb"></span>
              </div>
              <div class="sun-times">
                <div>
                  <label>Sunrise</label>
                  <strong id="sunrise">--:--</strong>
                </div>
                <div>
                  <label>Sunset</label>
                  <strong id="sunset">--:--</strong>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span>Air quality</span>
            </div>
            <div class="aqi-row">
              <div class="aqi-badge" id="aqiBadge">--</div>
              <div>
                <p class="aqi-label">US AQI</p>
                <strong id="aqiText">--</strong>
              </div>
            </div>
          </div>
        </aside>
      </main>

      <section class="forecast-panel card">
        <div class="card-header">
          <span>5-day forecast</span>
        </div>
        <div id="forecastList" class="forecast-list"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
